<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WK Mercearia</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--tx:#1b1b1b;--mut:#6b6b6b;--gold:#b8892b;--line:#e4dfd3;--bad:#b3261e;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,sans-serif;padding-bottom:40px}
header{background:#000;color:#d4a843;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 14px;position:sticky;top:0;z-index:9;display:flex;justify-content:space-between;align-items:center}
h1{margin:0;font:700 20px Georgia,serif;letter-spacing:.14em}
header button{background:none;border:1px solid #d4a843;color:#d4a843;border-radius:99px;padding:4px 12px;font-size:13px}
nav{display:flex;gap:6px;padding:10px 12px;overflow-x:auto}
nav button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:99px;padding:8px 16px;font-size:15px}
nav button.on{background:#000;color:#d4a843;border-color:#000}
main{padding:0 12px;max-width:640px;margin:0 auto}
input,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--tx);font:inherit;margin:4px 0}
label{font-size:13px;color:var(--mut)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0}
.row small,.card small{display:block;color:var(--mut)}
.l{display:flex;align-items:center;gap:10px;min-width:0}
.ph{width:52px;height:52px;border-radius:10px;object-fit:cover;background:#eee;flex:none;display:flex;align-items:center;justify-content:center;font-size:22px}
.r{display:flex;align-items:center;gap:6px;flex:none}
.pr{font-weight:700;color:var(--gold)}
.r button,.b{border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:8px;min-width:38px;height:38px;font-size:17px}
.sm{min-width:auto!important;padding:0 10px;font-size:13px!important}
.gold{background:#000;color:#d4a843;border:1px solid #000;font-weight:700;height:46px;width:100%;margin:10px 0;border-radius:10px;font-size:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}
.tot{display:flex;justify-content:space-between;margin:4px 0}
.msg{padding:24px 8px;text-align:center;color:var(--mut)}
.out{opacity:.5}.low{color:var(--bad);font-weight:700}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tag{display:inline-block;background:#000;color:#d4a843;border-radius:99px;padding:1px 10px;font-size:12px}
#t{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#000;color:#d4a843;padding:10px 18px;border-radius:99px;display:none;z-index:20;max-width:90%}
</style></head><body>
<header><h1>WK MERCEARIA</h1><button id="auth" data-a="auth">Entrar</button></header>
<nav id="tabs"></nav>
<main><input id="q" type="search" placeholder="Buscar por nome ou código"><div id="v"></div></main>
<div id="t"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* ===== CONFIGURAÇÃO: cole aqui os dados do seu projeto Supabase ===== */
const CFG={url:"https://gdsnbkmsmtalkgcopirg.supabase.co",key:"sb_publishable_0yJ38-lQNXW724A_EtSa9w_5r6lBnMf"};
/* ==================================================================== */
const sb=supabase.createClient(CFG.url,CFG.key);
const $=s=>document.querySelector(s),R=v=>"R$ "+(+v||0).toFixed(2).replace(".",","),
E=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let cat=[],cfg={taxa:0,minimo:0},cart={},me=null,tab="cat",ped=[],pf=[],ask="",pay="Pix",fv={};
const NX={novo:"separando",separando:"em entrega","em entrega":"entregue"};
const staff=()=>!!me&&["repositor","gerente","admin"].includes(me.cargo),mgr=()=>!!me&&["gerente","admin"].includes(me.cargo),adm=()=>me?.cargo==="admin";
const T=m=>{const t=$("#t");t.textContent=m;t.style.display="block";clearTimeout(T.h);T.h=setTimeout(()=>t.style.display="none",3500)};
async function go(f){try{const r=await f();if(r&&r.error)throw r.error;return r||true}catch(e){T(e.message||"Erro");return false}}
const img=p=>p.foto?`<img class="ph" src="${CFG.url}/storage/v1/object/public/fotos/${encodeURIComponent(p.foto)}" alt="">`:`<div class="ph">🛒</div>`;
const has=p=>p.disponivel??(p.estoque>0);
const step=c=>`<button data-a="m" data-c="${c}">−</button><b>${cart[c]||0}</b><button data-a="p" data-c="${c}">+</button>`;
const cartN=()=>Object.values(cart).reduce((a,b)=>a+b,0);
const sub=()=>Object.entries(cart).reduce((a,[c,n])=>{const p=cat.find(x=>x.codigo===c);return a+(p?p.preco*n:0)},0);
const flt=()=>{const q=$("#q").value.toLowerCase();return cat.filter(p=>!q||p.nome.toLowerCase().includes(q)||p.codigo.startsWith(q))};
async function loadMe(){
  const {data:{session}}=await sb.auth.getSession();me=null;
  if(session){const {data}=await sb.from("perfis").select("*").eq("id",session.user.id).maybeSingle();me=data||{cargo:"pendente"}}
}
async function loadCat(){
  const r=await sb.from(staff()?"produtos":"catalogo").select("*").order("nome");cat=r.data||[];
  const c=await sb.from("config").select("*").maybeSingle();if(c.data)cfg=c.data;
}
async function loadTab(){
  if(tab==="ped"){const r=await sb.from("pedidos_numerados").select("*").order("criado",{ascending:false}).limit(40);ped=r.data||[]}
  if(tab==="cfg"){const r=await sb.from("perfis").select("*").order("nome");pf=r.data||[]}
}
async function render(){
  $("#auth").textContent=me?"Sair":"Entrar";
  const tb=[["cat","Produtos"]];
  if(staff()){tb.push(["ped","Pedidos"],["est","Estoque"])}
  if(mgr())tb.push(["adm","Produtos+"]);
  if(adm())tb.push(["cfg","Admin"]);
  if(!staff())tb.push(["cart","Carrinho"+(cartN()?" ("+cartN()+")":"")]);
  if(!me&&tab!=="login")tb.push(["login","Funcionário"]);
  if(!tb.some(t=>t[0]===tab)&&tab!=="login")tab="cat";
  $("#tabs").innerHTML=tb.map(([k,l])=>`<button data-a="t" data-c="${k}" class="${k===tab?"on":""}">${l}</button>`).join("");
  $("#q").hidden=!["cat","est","adm"].includes(tab);
  const v=$("#v"),L=flt(),none=`<div class="msg">${cat.length?"Nada encontrado.":"Nenhum produto cadastrado."}</div>`;
  if(tab==="login"){v.innerHTML=`<div class="card"><label>Nome (só para criar conta)</label><input id="ln" autocomplete="name"><label>E-mail</label><input id="le" type="email" autocomplete="email"><label>Senha</label><input id="lp" type="password" autocomplete="current-password"><button class="gold" data-a="in">Entrar</button><button class="gold" style="background:#fff;color:#000" data-a="up">Criar conta de funcionário</button></div>`;return}
  if(me?.cargo==="pendente"&&tab==="cat")T("Sua conta aguarda liberação do ADM.");
  if(tab==="cat")v.innerHTML=L.length?L.map(p=>`<div class="row ${has(p)?"":"out"}"><div class="l">${img(p)}<div><b>${E(p.nome)}</b><small>cód. ${p.codigo}${has(p)?"":" · indisponível"}</small><span class="pr">${R(p.preco)}</span></div></div><div class="r">${has(p)&&!staff()?step(p.codigo):""}</div></div>`).join(""):none;
  if(tab==="cart"){
    const ci=Object.entries(cart).map(([c,n])=>[cat.find(x=>x.codigo===c),n]).filter(([p,n])=>p&&n>0),s=sub(),fee=ci.length?+cfg.taxa:0;
    v.innerHTML=ci.length?ci.map(([p])=>`<div class="row"><div class="l">${img(p)}<div><b>${E(p.nome)}</b><small>${R(p.preco)} cada</small></div></div><div class="r">${step(p.codigo)}</div></div>`).join("")+`<div class="card"><div class="tot"><span>Produtos</span><span>${R(s)}</span></div><div class="tot"><span>Taxa de entrega</span><span>${R(fee)}</span></div><div class="tot"><b>Total</b><b class="pr">${R(s+fee)}</b></div></div><div class="card"><label>Seu nome</label><input id="cn" value="${E(fv.cn)}"><label>Telefone</label><input id="ct" inputmode="tel" value="${E(fv.ct)}"><label>Endereço de entrega</label><input id="ca" value="${E(fv.ca)}"><label>Pagamento na entrega</label><select id="cp" data-a="pay"><option ${pay==="Pix"?"selected":""}>Pix</option><option ${pay==="Cartão"?"selected":""}>Cartão</option><option ${pay==="Dinheiro"?"selected":""}>Dinheiro</option></select>${pay==="Cartão"?`<label>Crédito ou débito?</label><select id="cc"><option>Crédito</option><option>Débito</option></select>`:""}${pay==="Dinheiro"?`<label>Troco para quanto? (vazio = sem troco)</label><input id="ctr" type="number" min="0" inputmode="decimal">`:""}<button class="gold" data-a="send">Enviar pedido</button></div>`:`<div class="msg">Seu carrinho está vazio.</div>`;
  }
  if(tab==="ped")v.innerHTML=`<button class="b gold" data-a="rf">Atualizar pedidos</button>`+(ped.length?ped.map(o=>`<div class="card"><b>#${String(o.numero_dia).padStart(3,"0")} · ${E(o.nome)}</b> <span class="tag">${E(o.status)}</span><small>${E(o.telefone)} · ${E(o.endereco)}</small>${(o.itens||[]).map(i=>`<div>${i.qtd}x ${E(i.nome)}</div>`).join("")}<div class="tot"><span>${E(o.pagamento)}</span><b class="pr">${R(o.total)}</b></div>${NX[o.status]?`<button class="b sm" style="height:36px" data-a="st" data-c="${o.id}" data-n="${NX[o.status]}">Marcar: ${NX[o.status]}</button>`:""}</div>`).join(""):`<div class="msg">Nenhum pedido ainda.</div>`);
  if(tab==="est")v.innerHTML=L.length?L.map(p=>`<div class="row"><div class="l">${img(p)}<div><b>${E(p.nome)}</b><small>cód. ${p.codigo}</small></div></div><div class="r"><button data-a="d" data-c="${p.codigo}" data-d="-1">−</button><b class="${p.estoque<=0?"low":""}" style="min-width:30px;text-align:center">${p.estoque}</b><button data-a="d" data-c="${p.codigo}" data-d="1">+</button><button class="sm" data-a="d" data-c="${p.codigo}" data-d="10">+10</button></div></div>`).join(""):none;
  if(tab==="adm")v.innerHTML=`<div class="card"><b>Produto</b><div class="g2"><div><label>Código (4 dígitos)</label><input id="fc" inputmode="numeric" maxlength="4"></div><div><label>Preço (R$)</label><input id="fp" type="number" step="0.01" min="0" inputmode="decimal"></div></div><label>Nome</label><input id="fn"><label>Quantidade em estoque</label><input id="fq" type="number" min="0" inputmode="numeric"><label>Foto (opcional)</label><input id="ff" type="file" accept="image/*"><button class="gold" data-a="save">Salvar produto</button></div>`+(L.map(p=>`<div class="row"><div class="l">${img(p)}<div><b>${E(p.nome)}</b><small>cód. ${p.codigo} · ${R(p.preco)} · estoque ${p.estoque}</small></div></div><div class="r"><button data-a="ed" data-c="${p.codigo}">✎</button><button class="sm" data-a="del" data-c="${p.codigo}">${ask===p.codigo?"Confirmar?":"🗑"}</button></div></div>`).join(""));
  if(tab==="cfg")v.innerHTML=`<div class="card"><b>Entrega</b><div class="g2"><div><label>Taxa de entrega (R$)</label><input id="sf" type="number" step="0.01" min="0" value="${cfg.taxa}"></div><div><label>Pedido mínimo (R$)</label><input id="sm" type="number" step="0.01" min="0" value="${cfg.minimo}"></div></div><button class="gold" data-a="cfg">Salvar</button></div><div class="card"><b>Equipe</b>${pf.map(x=>`<div style="margin:10px 0"><b>${E(x.nome||"Sem nome")}</b> <span class="tag">${E(x.cargo)}</span><small>${E(x.email)}</small><div class="r" style="margin-top:6px">${["pendente","repositor","gerente","admin"].map(r=>`<button class="sm" style="height:32px" data-a="cg" data-c="${x.id}" data-r="${r}">${r}</button>`).join("")}</div></div>`).join("")}</div>`;
}
const rs=f=>new Promise((ok,no)=>{const i=new Image();i.onload=()=>{const k=Math.min(1,500/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*k;c.height=i.height*k;c.getContext("2d").drawImage(i,0,0,c.width,c.height);c.toBlob(ok,"image/jpeg",.8)};i.onerror=no;i.src=URL.createObjectURL(f)});
const re=async()=>{await loadCat();await loadTab();render()};
document.addEventListener("click",async ev=>{
  const b=ev.target.closest("button[data-a]");if(!b)return;const a=b.dataset.a,c=b.dataset.c;
  if(a==="t"){tab=c;await loadTab();render()}
  else if(a==="auth"){if(me){await sb.auth.signOut();location.reload()}else{tab="login";render()}}
  else if(a==="p"){cart[c]=(cart[c]||0)+1;render()}
  else if(a==="m"){cart[c]=Math.max(0,(cart[c]||0)-1);render()}
  else if(a==="in"||a==="up"){
    const e=$("#le").value.trim(),p=$("#lp").value;
    const r=a==="in"?await go(()=>sb.auth.signInWithPassword({email:e,password:p})):await go(()=>sb.auth.signUp({email:e,password:p,options:{data:{nome:$("#ln").value.trim()}}}));
    if(r){await loadMe();tab="cat";await re();if(a==="up")T("Conta criada. Peça ao ADM para liberar seu cargo.")}
  }
  else if(a==="send"){
    fv={cn:$("#cn").value,ct:$("#ct").value,ca:$("#ca").value};
    const tr=$("#ctr")?.value,pg=pay==="Cartão"?"Cartão de "+$("#cc").value.toLowerCase():pay==="Dinheiro"?"Dinheiro"+(tr?" (troco para "+R(tr)+")":" (sem troco)"):"Pix";
    const itens=Object.entries(cart).filter(([k,n])=>n>0).map(([codigo,qtd])=>({codigo,qtd}));
    const r=await go(()=>sb.rpc("criar_pedido",{p_nome:fv.cn,p_tel:fv.ct,p_end:fv.ca,p_pag:pg,p_itens:itens}));
    if(r){cart={};tab="cat";T("Pedido enviado! Aguarde a entrega.");await re()}
  }
  else if(a==="rf"){await re()}
  else if(a==="st"){if(await go(()=>sb.from("pedidos").update({status:b.dataset.n}).eq("id",c)))await re()}
  else if(a==="d"){if(await go(()=>sb.rpc("ajustar_estoque",{p_codigo:c,p_delta:+b.dataset.d})))await re()}
  else if(a==="ed"){const p=cat.find(x=>x.codigo===c);$("#fc").value=c;$("#fn").value=p.nome;$("#fp").value=p.preco;$("#fq").value=p.estoque;scrollTo({top:0,behavior:"smooth"})}
  else if(a==="del"){if(ask!==c){ask=c;render();return}ask="";if(await go(()=>sb.from("produtos").delete().eq("codigo",c)))await re()}
  else if(a==="save"){
    const o={codigo:$("#fc").value.trim(),nome:$("#fn").value.trim(),preco:+$("#fp").value},qt=$("#fq").value,f=$("#ff").files[0];
    if(!/^\d{4}$/.test(o.codigo)||!o.nome||$("#fp").value===""){T("Informe código de 4 dígitos, nome e preço.");return}
    if(qt!=="")o.estoque=Math.max(0,Math.floor(+qt));
    if(f){const nm=o.codigo+"-"+Date.now()+".jpg";if(!await go(async()=>sb.storage.from("fotos").upload(nm,await rs(f),{contentType:"image/jpeg"})))return;o.foto=nm}
    if(await go(()=>sb.from("produtos").upsert(o))){T("Produto salvo");await re()}
  }
  else if(a==="cfg"){if(await go(()=>sb.from("config").update({taxa:+$("#sf").value||0,minimo:+$("#sm").value||0}).eq("id",1))){T("Salvo");await re()}}
  else if(a==="cg"){if(await go(()=>sb.from("perfis").update({cargo:b.dataset.r}).eq("id",c)))await re()}
});
document.addEventListener("change",e=>{if(e.target.dataset.a==="pay"){fv={cn:$("#cn").value,ct:$("#ct").value,ca:$("#ca").value};pay=e.target.value;render()}});
$("#q").oninput=render;
setInterval(()=>{if(tab==="ped"&&staff())re()},20000);
(async()=>{await loadMe();await loadCat();render()})();
</script></body></html>
